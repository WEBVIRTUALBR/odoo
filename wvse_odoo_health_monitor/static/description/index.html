<div class="container text-center" style="max-width:100%;">
  <h2 style="margin-top:20px;">Galeria</h2>
  <h4 style="color:#dc3545;">Múltiplos Álbuns</h4>

  <div class="row" style="margin-top:30px;">

    <!-- ALBUM 1 -->
    <div class="col-md-4 col-sm-12" style="margin-bottom:15px;">
      <div onclick="openGallery(0)">
        <img src="https://picsum.photos/800/400" style="width:100%; height:auto; cursor:pointer; border-radius:6px;">
        <div style="font-size:14px; margin-top:5px; text-transform:uppercase;">Album One</div>
      </div>
    </div>

    <!-- ALBUM 2 -->
    <div class="col-md-4 col-sm-12" style="margin-bottom:15px;">
      <div onclick="openGallery(1)">
        <img src="https://picsum.photos/801/400" style="width:100%; height:auto; cursor:pointer; border-radius:6px;">
        <div style="font-size:14px; margin-top:5px; text-transform:uppercase;">Album Two</div>
      </div>
    </div>

    <!-- ALBUM 3 -->
    <div class="col-md-4 col-sm-12" style="margin-bottom:15px;">
      <div onclick="openGallery(2)">
        <img src="https://picsum.photos/802/400" style="width:100%; height:auto; cursor:pointer; border-radius:6px;">
        <div style="font-size:14px; margin-top:5px; text-transform:uppercase;">Album Three</div>
      </div>
    </div>

  </div>
</div>

<!-- MODAL -->
<div id="galleryModal" class="modal fade" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content" style="background:#000;">
      <div class="modal-body text-center" style="padding:0;">
        <img id="galleryImage" src="" style="width:100%; height:auto;">
      </div>
      <div style="position:absolute; top:50%; left:10px; transform:translateY(-50%);">
        <button onclick="prevImage()" style="background:rgba(0,0,0,0.5); color:#fff; border:none; padding:10px;">‹</button>
      </div>
      <div style="position:absolute; top:50%; right:10px; transform:translateY(-50%);">
        <button onclick="nextImage()" style="background:rgba(0,0,0,0.5); color:#fff; border:none; padding:10px;">›</button>
      </div>
    </div>
  </div>
</div>

<script>
var galleries = [
  [
    "https://picsum.photos/1500/1000",
    "https://picsum.photos/1501/1000",
    "https://picsum.photos/1500/1001"
  ],
  [
    "https://source.unsplash.com/LuK-MuZ-yf0/1500x1000",
    "https://source.unsplash.com/Oaqk7qqNh_c/1500x1000"
  ],
  [
    "https://source.unsplash.com/X9GHkHbJIaU/1500x1000",
    "https://source.unsplash.com/9c_djeQTDyY/1500x1000"
  ]
];

var currentGallery = 0;
var currentIndex = 0;

function openGallery(galleryIndex) {
  currentGallery = galleryIndex;
  currentIndex = 0;
  showImage();
  $('#galleryModal').modal('show');
}

function showImage() {
  document.getElementById("galleryImage").src = galleries[currentGallery][currentIndex];
}

function nextImage() {
  currentIndex = (currentIndex + 1) % galleries[currentGallery].length;
  showImage();
}

function prevImage() {
  currentIndex = (currentIndex - 1 + galleries[currentGallery].length) % galleries[currentGallery].length;
  showImage();
}
</script>
