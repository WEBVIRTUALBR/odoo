<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Galeria Categorizada</title>

    <style>
        /* CSS do Lightbox e Animação */
        .lightbox {
            display: none;
            backdrop-filter: blur(5px);
        }
        .lightbox:target {
            display: flex !important;
        }
        .hover-zoom {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .hover-zoom:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2) !important;
        }
        
        /* Deixa o cursor com formato de "mãozinha" ao passar sobre os títulos das categorias */
        summary {
            cursor: pointer;
            transition: background-color 0.2s;
        }
        summary:hover {
            background-color: #f8f9fa;
        }
    </style>
</head>
