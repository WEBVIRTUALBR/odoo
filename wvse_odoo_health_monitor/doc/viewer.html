ludes\n-------------------------\n\n- Backend business models and server-side Python logic are present.\n- HTTP controller endpoints are present.\n- Custom API endpoints are present.\n- Webhook endpoints are present.\n- Wizard flows are present for guided or transient operations.\n- Reporting resources are present.\n- Security resources such as access control and record rules are present.\n- XML user interface resources such as menus, actions, forms, lists, search views, or dashboards are present.\n- Frontend assets such as JavaScript, SCSS, CSS, XML templates, or images are present.\n- Frontend test resources are present.\n- Python test resources are present.\n- Translation resources are present.\n- Demo data resources are present.\n- Configuration settings are exposed through the Odoo settings interface.\n- Portal-facing functionality is present.\n- Website-facing functionality is present.\n- Versioned upgrade scripts are present under the upgrades directory.\n- Manifest dependencies are declared: base, mail, project, hr_attendance, hr_timesheet.\n\nDeployment and Compatibility Guidance\n-------------------------------------\n\n- The manifest version indicates that the module targets the Odoo **15.0.1.1.0** series or a variant derived from that series.\n- Always validate the target hosting model before deployment.\n- Always validate declared dependencies before installation.\n- Always validate staging installation before promoting the module to production.\n- Always back up the database before installing or updating any custom or third-party module.\n\nInstallation Guide\n------------------\n\nInstallation from a Downloaded Package\n~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n1. Download the module package from the store or receive it from the provider.\n2. Extract the package and place the module folder into the custom addons path used by your Odoo server.\n3. Restart the Odoo service or Odoo process.\n4. Open the Apps menu.\n5. Update the apps list.\n6. Search for         function escapeHtml(value) {
            return value
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        function renderInline(text) {
            let html = escapeHtml(text);
            html = html.replace(/``([^`]+)``/g, '<code class="inline">$1</code>');
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            return html;
        }

        function isUnderline(line) {
            const trimmed = line.trim();
            if (!trimmed) return false;
            return /^(=+|-+|~+|\^+|"+)$/.test(trimmed);
        }

        function headingLevel(char) {
            if (char === "=") return 1;
            if (char === "-") return 2;
            if (char === "~") return 3;
            if (char === "^") return 4;
            return 5;
        }

        function slugify(value) {
            return value
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "")
                || "section";

        function renderRst(rstText) {
            const lines = rstText.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
            const htmlParts = [];

            let i = 0;

            while (i < lines.length) {
                const line = lines[i];
                const next = i + 1 < lines.length ? lines[i + 1] : "";

                if (line.trim() && isUnderline(next) && next.trim().length >= line.trim().length) {
                    const level = headingLevel(next.trim()[0]);
                    const title = line.trim();
                    const id = slugify(title + "-" + i);
                    toc.push({ level, title, id });
                    htmlParts.push(`<h${level} id="${id}">${renderInline(title)}</h${level}>`);
                    i += 2;
                    continue;
                }

                if (line.trim().startsWith(".. contents::")) {
                    i++;
                    while (i < lines.length && (lines[i].startsWith("   ") || lines[i].startsWith(":") || !lines[i].trim())) {
                        i++;
                    }
                    continue;
                }

                if (line.trim().endsWith("::")) {
                    const block = [];
                    i += 1;
                    if (i < lines.length && !lines[i].trim()) {
                        i++;
                    }
                    while (i < lines.length && (lines[i].startsWith("    ") || !lines[i].trim())) {
                        block.push(lines[i].startsWith("    ") ? lines[i].slice(4) : "");
                        i++;
                    }
                    htmlParts.push(`<pre>${escapeHtml(block.join("\n"))}</pre>`);
                    continue;
                }

                if (/^\s*[-*]\s+/.test(line)) {
                    const items = [];
                    while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
                        items.push(lines[i].replace(/^\s*[-*]\s+/, ""));
                        i++;
                    }
                    htmlParts.push("<ul>" + items.map(item => `<li>${renderInline(item)}</li>`).join("") + "</ul>");
                    continue;
                }

                if (!line.trim()) {
                    i++;
                    continue;
                }

                if (line.startsWith("    ")) {
                    const block = [];
                    while (i < lines.length && (lines[i].startsWith("    ") || !lines[i].trim())) {
                        block.push(lines[i].startsWith("    ") ? lines[i].slice(4) : "");
                        i++;
                    }
                    htmlParts.push(`<pre>${escapeHtml(block.join("\n"))}</pre>`);
                    continue;
                }

                const paragraph = [line.trim()];
                i++;
                while (
                    i < lines.length &&
                    lines[i].trim() &&
                    !/^\s*[-*]\s+/.test(lines[i]) &&
                    !(i + 1 < lines.length && isUnderline(lines[i + 1])) &&
                    !lines[i].startsWith("    ") &&
                    !lines[i].trim().startsWith(".. contents::")
                ) {
                    paragraph.push(lines[i].trim());
                    i++;
                }

                htmlParts.push(`<p>${renderInline(paragraph.join(" "))}</p>`);
            }

            return { html: htmlParts.join("\n"), toc };
        }
